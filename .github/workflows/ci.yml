name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Validate link data
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build
