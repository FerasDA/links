name: Weekly link check

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Check links
        run: npm run checklinks -- --timeout 15

      - name: Validate link data
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Create pull request for link status updates
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update link check statuses"
          branch: chore/weekly-link-check
          delete-branch: true
          title: "chore: update link check statuses"
          body: |
            Automated weekly link check.

            This PR updates link status metadata in `data/links.json`.
            It never deletes links automatically; review status changes before merging.
          add-paths: |
            data/links.json
